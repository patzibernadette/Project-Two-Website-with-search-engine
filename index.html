<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Second Project Music VibeSearch</title>
    <link rel="stylesheet" href="./css/site.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            font-family: "Sofia", sans-serif;
            color: white;
            text-align: center;
            font-size: large;
        }
    </style>
    <style>
        body {
            background-image: url(a-sky-full-of-stars.jpg);
        }
    </style>
</head>

<body>

    <header>
        <h1> Giphy Vibe Search</h1>
        <div>
            <p class="d-inline-flex gap-5" role="group" aria-label="Large button group">
                <button type="button" class="btn btn-outline-light">Home</button>
                <button type="button" class="btn btn-outline-light">Trending</button>
                <button type="button" class="btn btn-outline-light">About</button>
            </p>
        </div>
    </header>

    <div>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <form id="searchForm" class="search-section">
                    <input type="search" id="searchInput" placeholder="Search for vibe GIFs..." />
                    <button type="submit">Search</button>
                </form>
            </div>
        </nav>
    </div>

    <div id="results"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
