<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Second Project Music VibeSearch</title>
    <link rel="stylesheet" href="./css/site.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            font-family: "Sofia", sans-serif;
            color: white;
            text-align: center;
            font-size: large;
        }
    </style>
    <style>
        body {
            background-image: url(a-sky-full-of-stars.jpg);
        }
    </style>
</head>
<body>
    <main class="container-fluid">
        <h1>Giphy Vibe Search </h1>

        <div>
            <ul class="nav justify-content-center">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Trending</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>
        </div>
    </main>

    <div>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <form class="d-flex" role="search">
                    <input id="search" type="search" placeholder="Search for a vibe..." aria-label="Search" />
                    <button id="submit" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </div>


    <div>
        <p class="d-inline-flex gap-5" role="group" aria-label="Large button group">
            <button type="button" class="btn btn-outline-light">Party</button>
            <button type="button" class="btn btn-outline-light">Sad</button>
            <button type="button" class="btn btn-outline-light">Chill</button>
            <button type="button" class="btn btn-outline-light">Workout</button>
        </p>
    </div>




 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


   
</body>

</html>
